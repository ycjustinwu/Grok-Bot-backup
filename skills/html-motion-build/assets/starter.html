<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML Motion — starter</title>
<!-- Optional CDN font. Remove if you want zero network. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { /* PLACEHOLDER — replace with brief CANVAS; do not ship house-black by habit */ --bg:#F4E9D5; --ink:#1a1a1a; --mute:#6b6560; --accent:#c45c26; }
  html,body { margin:0; height:100%; background:#1a1a1a; overflow:hidden; } /* letterbox only; stage uses --bg */
  body { display:grid; place-items:center; font-family:Inter,system-ui,sans-serif; }
  /* Fixed design-space stage; scaled to fit by JS (letterboxed). */
  #stage { position:relative; overflow:hidden; background:var(--bg); color:var(--ink);
           transform-origin:0 0; position:absolute; left:0; top:0; }
  #stage * { box-sizing:border-box; }
  .abs { position:absolute; left:0; top:0; transform-origin:0 0; will-change:auto; }
  /* Controls: hidden in render mode */
  #ui { position:fixed; left:0; right:0; bottom:0; display:flex; gap:10px; align-items:center;
        padding:10px 14px; background:linear-gradient(transparent,rgba(0,0,0,.7)); color:#fff;
        font:12px/1 "JetBrains Mono",monospace; opacity:.0; transition:opacity .2s; }
  body:hover #ui { opacity:1; }
  #ui button { background:#fff1; color:#fff; border:1px solid #fff3; border-radius:6px; padding:6px 10px; cursor:pointer; }
  #ui input[type=range] { flex:1; }
  .render #ui { display:none; }
</style>
</head>
<body>
<div id="stage">
  <!-- Scene DOM goes here. Position everything with transform only. -->
  <canvas id="cv" class="abs"></canvas>
  <div id="title" class="abs" style="font-weight:800;font-size:120px;letter-spacing:-0.04em;">Hello motion</div>
</div>
<div id="ui">
  <button id="bPlay">❚❚</button><button id="bRestart">⟲</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="tc">0.00 / 0.00</span>
</div>
<script>
/* ================= CONFIG (edit) ================= */
const STAGE = { w: 1920, h: 1080 };        // 1920x1080 | 1080x1920 | 1080x1080
const DURATION = 10;                       // seconds
const FPS = 60;                            // preview + render target
const SEED = 7;

/* ================= MATH / EASING ================= */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,t0,t1)=>clamp((t-t0)/(t1-t0));           // 0..1 window
const E={ linear:t=>t,
  out:t=>1-Math.pow(1-t,4),  outExpo:t=>t===1?1:1-Math.pow(2,-10*t),
  in:t=>t*t*t,  inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  smooth:t=>t*t*(3-2*t),
  back:t=>{const c=1.4;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);} };
// closed-form critically damped spring step response (pure function of time since start)
const spring=(dt,w=14)=> dt<=0?0:1-(1+w*dt)*Math.exp(-w*dt);
// tween: value of a->b over [t0,t1] with ease
const tw=(t,t0,t1,a,b,ease=E.out)=>lerp(a,b,ease(prog(t,t0,t1)));
// seeded rand — never Math.random in render paths
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand=mulberry32(SEED);

/* ================= TIMELINE AS DATA ================= */
// Each beat: [start, end, label]. Scenes read local time from here.
const BEATS = [
  [0.0, 2.0, 'hook'],
  [2.0, 7.0, 'body'],
  [7.0, 10.0, 'resolve'],
];

/* ================= STAGE SETUP ================= */
const stage=document.getElementById('stage');
const cv=document.getElementById('cv'), cx=cv.getContext('2d');
stage.style.width=STAGE.w+'px'; stage.style.height=STAGE.h+'px';
cv.width=STAGE.w; cv.height=STAGE.h;
const params=new URLSearchParams(location.search);
const RENDER=params.has('render');                    // render mode: no UI, no autoplay
if(RENDER) document.body.classList.add('render');
function fit(){
  const s=RENDER?1:Math.min(innerWidth/STAGE.w, innerHeight/STAGE.h);
  const x=RENDER?0:(innerWidth-STAGE.w*s)/2, y=RENDER?0:(innerHeight-STAGE.h*s)/2;
  stage.style.transform=`translate(${x}px,${y}px) scale(${s})`;
}
addEventListener('resize',fit); fit();
const $=id=>document.getElementById(id);
const T=(el,x,y,s=1,r=0)=>{el.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;};

/* ================= RENDER: pure function of t ================= */
function render(t){
  // canvas layer
  cx.clearRect(0,0,STAGE.w,STAGE.h);
  const p=tw(t,0.2,1.4,0,1);
  cx.fillStyle='#2f6bff'; cx.fillRect(160,STAGE.h-220,(STAGE.w-320)*p,8);
  // DOM layer
  const el=$('title');
  const a=tw(t,0.3,1.2,0,1), y=tw(t,0.3,1.2,80,0);
  el.style.opacity=a; T(el,160,STAGE.h/2-80+y);
}

/* ================= TRANSPORT ================= */
let cur=+(params.get('t')||0), playing=!RENDER && !params.has('t'), last=null;
function seek(t){ cur=clamp(t,0,DURATION); render(cur); syncUI(); }
function syncUI(){ if(RENDER)return; $('scrub').value=Math.round(cur/DURATION*1000); $('tc').textContent=`${cur.toFixed(2)} / ${DURATION.toFixed(2)}`; $('bPlay').textContent=playing?'❚❚':'▶'; }
function loop(ts){ try{
    if(playing){ if(last!=null) cur+= (ts-last)/1000; if(cur>=DURATION) cur=0; render(cur); syncUI(); }
    last=ts; }catch(e){ console.error(e); playing=false; }
  requestAnimationFrame(loop); }
if(!RENDER){
  $('bPlay').onclick=()=>{playing=!playing; last=null; syncUI();};
  $('bRestart').onclick=()=>{seek(0); playing=true; last=null;};
  $('scrub').oninput=e=>{playing=false; seek(e.target.value/1000*DURATION);};
  addEventListener('keydown',e=>{ if(e.code==='Space'){playing=!playing;last=null;syncUI();e.preventDefault();}
    if(e.code==='ArrowRight')seek(cur+1/FPS*(e.shiftKey?30:1)); if(e.code==='ArrowLeft')seek(cur-1/FPS*(e.shiftKey?30:1)); });
}
/* ================= RENDER CONTRACT (used by recorder) ================= */
window.STAGE=STAGE; window.DURATION=DURATION; window.FPS=FPS; window.BEATS=BEATS;
window.seek=seek;
window.__ready=(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{ seek(cur); return true; });
requestAnimationFrame(loop);
</script>
</body>
</html>
